apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: watcher-filemon
  namespace: watcher
spec:
  selector:
    matchLabels:
      app: watcher-filemon
  template:
    metadata:
      labels:
        app: watcher-filemon
    spec:
      serviceAccountName: watcher-course-reader
      containers:
      - name: watcher-filemon
        image: harbor.jedutools.io/jdevops/watcher-filemon:REPLACE_WITH_COMMIT_SHA
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-metrics
          containerPort: 3000
        readinessProbe:
          httpGet:
            path: /metrics
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: http-metrics
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: jcode-vol
          mountPath: /watcher/codes
          subPath: workspace
          readOnly: true
        - name: snapshot-volume
          mountPath: /watcher/snapshots
        - name: logs-volume
          mountPath: /opt/filemon/logs
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOG_LEVEL
          value: "INFO"
        - name: API_SERVER
          value: "http://watcher-backend-service:3000"
        - name: METRICS_PORT
          value: "3000"
        - name: JCODE_ENVIRONMENT
          value: "prod"
        - name: SPOOL_PATH
          value: "/opt/filemon/logs/$(MY_NODE_NAME)-event-spool.db"
      imagePullSecrets:
      - name: watcher-harbor-registry-secret
      volumes:
      - name: jcode-vol
        persistentVolumeClaim:
          claimName: jcode-vol-pvc
      - name: snapshot-volume
        persistentVolumeClaim:
          claimName: watcher-filemon-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: watcher-filemon-logs-pvc
