apiVersion: batch/v1
kind: Job
metadata:
  name: watcher-backend-migration
  namespace: watcher
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: watcher-backend-migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: watcher-harbor-registry-secret
      containers:
      - name: migrate
        image: harbor.jbnu.ac.kr/jdevops/watcher-backend:REPLACE_WITH_COMMIT_SHA
        command: ["python", "-m", "db.migrate"]
        env:
        - name: DB_URL
          value: sqlite:////app/data/database.db
        volumeMounts:
        - name: data-storage
          mountPath: /app/data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: watcher-backend-pvc
