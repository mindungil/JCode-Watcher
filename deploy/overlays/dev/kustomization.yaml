apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml
  - registry-secret.yaml
  - workspace-pvc.yaml
namespace: dev
patches:
  - path: collector-node-selector.yaml
    target:
      kind: DaemonSet
  - path: servicemonitor-namespace.yaml
    target:
      kind: ServiceMonitor
  - target:
      kind: PersistentVolumeClaim
      name: watcher-backend-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: nfs-dev
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: watcher-filemon-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: nfs-dev
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: watcher-filemon-logs-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: nfs-dev
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: watcher-procmon-logs-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: nfs-dev
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
images:
  - name: harbor.jbnu.ac.kr/jdevops/watcher-backend
    newName: harbor.jbnu.ac.kr/jdevops/watcher-backend
    digest: sha256:REPLACE_WITH_VERIFIED_DIGEST
  - name: harbor.jbnu.ac.kr/jdevops/watcher-filemon
    newName: harbor.jbnu.ac.kr/jdevops/watcher-filemon
    digest: sha256:REPLACE_WITH_VERIFIED_DIGEST
  - name: harbor.jbnu.ac.kr/jdevops/watcher-procmon
    newName: harbor.jbnu.ac.kr/jdevops/watcher-procmon
    digest: sha256:REPLACE_WITH_VERIFIED_DIGEST
