name: PR checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt
      - run: python -m pip install -r packages/backend/requirements.txt pytest
      - run: PYTHONPATH=packages/backend python -m pytest -q packages/backend/tests

  collectors:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --project packages/filemon pytest -q packages/filemon/tests
      - run: uv run --project packages/procmon pytest -q packages/procmon/tests

  manifests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render dev and production manifests
        run: |
          kubectl kustomize deploy/overlays/dev > /tmp/watcher-dev.yaml
          kubectl kustomize deploy/overlays/production > /tmp/watcher-production.yaml
          kubectl kustomize deploy/migration/overlays/dev > /tmp/watcher-migration-dev.yaml
          kubectl kustomize deploy/migration/overlays/production > /tmp/watcher-migration-production.yaml
      - name: Verify collector contract
        run: |
          for rendered in /tmp/watcher-dev.yaml /tmp/watcher-production.yaml; do
            test "$(grep -c '^kind: DaemonSet$' "$rendered")" -eq 2
            if grep -Eq 'containerPort: 9090|targetPort: 9090|port: 9090|METRICS_PORT.*9090' "$rendered"; then
              exit 1
            fi
            grep -q 'name: METRICS_PORT' "$rendered"
            grep -q 'value: "3000"' "$rendered"
          done
      - name: Verify deployment safety contract
        run: |
          grep -q 'replicas: 1' /tmp/watcher-production.yaml
          if grep -q 'replicas: 2' /tmp/watcher-production.yaml; then exit 1; fi
          grep -q 'claimName: jcode-vol-pvc' /tmp/watcher-dev.yaml
          if grep -q 'pvc-5ba357bc' /tmp/watcher-dev.yaml; then exit 1; fi
          if grep -R -q 'watcher-schema' deploy packages/backend; then exit 1; fi
          bash -n deploy/deploy.sh
          python deploy/set-image-digests.py dev \
            sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          kubectl kustomize deploy/overlays/dev | grep -q 'watcher-backend@sha256:aaaaaaaa'
          kubectl kustomize deploy/migration/overlays/dev | grep -q 'watcher-backend@sha256:aaaaaaaa'
