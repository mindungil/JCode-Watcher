name: Build & Push

on:
  push:
    branches: [develop]
    paths: ['packages/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.jbnu.ac.kr
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      
      - name: Check changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'packages/backend/**'
            filemon:
              - 'packages/filemon/**'
            procmon:
              - 'packages/procmon/**'
      
      - name: Build backend
        id: backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/backend
          push: true
          tags: harbor.jbnu.ac.kr/jdevops/watcher-backend:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Build filemon
        id: filemon
        if: steps.changes.outputs.filemon == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/filemon
          push: true
          tags: harbor.jbnu.ac.kr/jdevops/watcher-filemon:${{ github.sha }}
          provenance: true
          sbom: true
      
      - name: Build procmon  
        id: procmon
        if: steps.changes.outputs.procmon == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/procmon
          push: true
          tags: harbor.jbnu.ac.kr/jdevops/watcher-procmon:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Record image digests
        run: |
          {
            echo "backend=${{ steps.backend.outputs.digest }}"
            echo "filemon=${{ steps.filemon.outputs.digest }}"
            echo "procmon=${{ steps.procmon.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
