apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-backend
  namespace: dev  # watcher 네임스페이스 추가
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watcher-backend
  template:
    metadata:
      labels:
        app: watcher-backend
    spec:
      initContainers:
        - name: wait-for-migration
          image: watcher-backend-dev:dev
          command: ["sh", "-c", "until test -f /app/data/.watcher-schema-v1; do sleep 2; done"]
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
      containers:
        - name: watcher-backend
          image: watcher-backend-dev:dev
          imagePullPolicy: IfNotPresent 
          env:
            - name: DB_URL
              value: "sqlite:////app/data/database.db"
            - name: AUTO_CREATE_SCHEMA
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: watcher-backend-pvc
      tolerations:
        - key: "dev-node"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: watcher-backend-service
  namespace: dev  # watcher 네임스페이스 추가
  labels:
    app: watcher-backend
spec:
  type: ClusterIP  # 내부 네트워크에서만 접근 가능
  selector:
    app: watcher-backend
  ports:
    - name: watcher-backend-port
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: watcher-backend-monitor
  namespace: dev
  labels:
    app: watcher-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: watcher-backend
  namespaceSelector:
    matchNames:
      - watcher
  endpoints:
    - port: watcher-backend-port
      path: /metrics
      interval: 30s
